name: "Setup Bobslab Monorepo"
description: "Sets up pnpm, Node.js with npm registry configuration, and installs dependencies"

inputs:
  npm_token:
    description: "NPM authentication token for publishing or installing private packages"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: "pnpm"
        registry-url: "https://registry.npmjs.org"

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm_token }}
