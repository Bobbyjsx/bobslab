name: "Setup Bobslab Monorepo"
description: "Sets up pnpm, Node.js, and installs dependencies"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: "pnpm"

    - name: Ensure npm CLI supports OIDC Trusted Publishing
      shell: bash
      run: npm install -g npm@latest

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
