name: Deploy Packages to npm

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Changed Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Version Changes
        id: version_check
        run: node .github/scripts/detect-version-changes.mjs "${{ github.event.before }}"

      - name: Report Skip
        if: steps.version_check.outputs.has_changes != 'true'
        run: echo "No package versions changed in this push. Skipping npm deployment."

      - name: Setup Project
        if: steps.version_check.outputs.has_changes == 'true'
        uses: ./.github/actions/setup-project
        with:
          npm_token: ${{ secrets.NPM_TOKEN }}

      - name: Build & Test Changed Packages
        if: steps.version_check.outputs.has_changes == 'true'
        env:
          PACKAGES_JSON: ${{ steps.version_check.outputs.packages_json }}
        run: |
          node -e '
          const { execSync } = require("node:child_process");
          const pkgs = JSON.parse(process.env.PACKAGES_JSON);
          const filters = pkgs.map(p => `--filter="${p.name}..."`).join(" ");
          console.log(`\n========================================`);
          console.log(`Building & Testing: ${pkgs.map(p => `${p.name}@${p.newVersion}`).join(", ")}`);
          console.log(`========================================\n`);
          execSync(`pnpm exec turbo build ${filters}`, { stdio: "inherit" });
          execSync(`pnpm exec turbo test ${filters}`, { stdio: "inherit" });
          '

      - name: Publish to npm
        if: steps.version_check.outputs.has_changes == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGES_JSON: ${{ steps.version_check.outputs.packages_json }}
        run: |
          node -e '
          const { execSync } = require("node:child_process");
          const pkgs = JSON.parse(process.env.PACKAGES_JSON);
          for (const p of pkgs) {
            console.log(`\n========================================`);
            console.log(`Publishing production release: ${p.name}@${p.newVersion}`);
            console.log(`========================================\n`);
            try {
              execSync(`pnpm --filter "${p.name}" publish --access public --no-git-checks`, {
                stdio: "inherit",
                env: { ...process.env, NODE_AUTH_TOKEN: process.env.NPM_TOKEN }
              });
            } catch (err) {
              const msg = err.message || "";
              if (msg.includes("previously published") || msg.includes("Cannot publish over") || msg.includes("E403") || msg.includes("E409")) {
                console.warn(`Package ${p.name}@${p.newVersion} is already published or staged on npm. Continuing.`);
              } else {
                throw err;
              }
            }
          }
          '

      - name: Create Git Tags
        if: steps.version_check.outputs.has_changes == 'true'
        env:
          PACKAGES_JSON: ${{ steps.version_check.outputs.packages_json }}
        run: |
          node -e '
          const { execSync } = require("node:child_process");
          const pkgs = JSON.parse(process.env.PACKAGES_JSON);
          for (const p of pkgs) {
            const tag = `${p.name}@${p.newVersion}`;
            try {
              execSync(`git tag ${tag}`);
              execSync(`git push origin ${tag}`);
              console.log(`Pushed git tag: ${tag}`);
            } catch (err) {
              console.warn(`Tag ${tag} creation note: ${err.message}`);
            }
          }
          '
