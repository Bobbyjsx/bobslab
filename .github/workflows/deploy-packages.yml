name: Deploy Packages to npm

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  group: deploy-packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Deploy Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Base Branch (PR only)
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }}

      - name: Detect Version Changes
        id: version_check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node .github/scripts/detect-version-changes.mjs "origin/${{ github.base_ref }}"
          else
            node .github/scripts/detect-version-changes.mjs "${{ github.event.before }}"
          fi

      - name: Report Skip
        if: steps.version_check.outputs.has_changes != 'true'
        run: echo "No package versions changed. Skipping npm deployment."

      - name: Setup Project
        if: steps.version_check.outputs.has_changes == 'true'
        uses: ./.github/actions/setup-project

      # ----------------------------------------------------
      # PR Test Release Workflow
      # ----------------------------------------------------
      - name: Apply PR Test Versions
        id: apply_versions
        if: github.event_name == 'pull_request' && steps.version_check.outputs.has_changes == 'true'
        env:
          PR_NUMBER: ${{ github.event.number }}
          RUN_NUMBER: ${{ github.run_number }}
          PACKAGES_JSON: ${{ steps.version_check.outputs.packages_json }}
        run: node .github/scripts/apply-pr-version.mjs

      - name: Build & Test (PR)
        if: github.event_name == 'pull_request' && steps.version_check.outputs.has_changes == 'true'
        env:
          PACKAGES_JSON: ${{ steps.version_check.outputs.packages_json }}
        run: |
          node -e '
          const { execSync } = require("node:child_process");
          const pkgs = JSON.parse(process.env.PACKAGES_JSON);
          const filters = pkgs.map(p => `--filter="${p.name}..."`).join(" ");
          console.log(`\n========================================`);
          console.log(`Building & Testing test packages: ${pkgs.map(p => p.name).join(", ")}`);
          console.log(`========================================\n`);
          execSync(`pnpm exec turbo build ${filters}`, { stdio: "inherit" });
          execSync(`pnpm exec turbo test ${filters}`, { stdio: "inherit" });
          '

      - name: Publish Test Packages to npm (OIDC)
        id: publish_test_packages
        if: github.event_name == 'pull_request' && steps.version_check.outputs.has_changes == 'true'
        env:
          PR_NUMBER: ${{ github.event.number }}
          RUN_NUMBER: ${{ github.run_number }}
          UPDATED_PACKAGES_JSON: ${{ steps.apply_versions.outputs.updated_packages_json }}
        run: node .github/scripts/publish-test-packages.mjs

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.version_check.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = process.env.COMMENT_MARKDOWN;
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const botComment = comments.data.find(c =>
              c.body && c.body.includes("Bobslab Prerelease Test Build")
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody,
              });
            }
        env:
          COMMENT_MARKDOWN: ${{ steps.publish_test_packages.outputs.comment_markdown || steps.apply_versions.outputs.comment_markdown }}

      # ----------------------------------------------------
      # Main Production Release Workflow
      # ----------------------------------------------------
      - name: Build & Test (Main)
        if: github.event_name == 'push' && steps.version_check.outputs.has_changes == 'true'
        env:
          PACKAGES_JSON: ${{ steps.version_check.outputs.packages_json }}
        run: |
          node -e '
          const { execSync } = require("node:child_process");
          const pkgs = JSON.parse(process.env.PACKAGES_JSON);
          const filters = pkgs.map(p => `--filter="${p.name}..."`).join(" ");
          console.log(`\n========================================`);
          console.log(`Building & Testing: ${pkgs.map(p => `${p.name}@${p.newVersion}`).join(", ")}`);
          console.log(`========================================\n`);
          execSync(`pnpm exec turbo build ${filters}`, { stdio: "inherit" });
          execSync(`pnpm exec turbo test ${filters}`, { stdio: "inherit" });
          '

      - name: Publish Production Release to npm (OIDC)
        if: github.event_name == 'push' && steps.version_check.outputs.has_changes == 'true'
        env:
          PACKAGES_JSON: ${{ steps.version_check.outputs.packages_json }}
        run: node .github/scripts/publish-prod-packages.mjs

      - name: Create Git Tags
        if: github.event_name == 'push' && steps.version_check.outputs.has_changes == 'true'
        env:
          PACKAGES_JSON: ${{ steps.version_check.outputs.packages_json }}
        run: |
          node -e '
          const { execSync } = require("node:child_process");
          const pkgs = JSON.parse(process.env.PACKAGES_JSON);
          for (const p of pkgs) {
            const tag = `${p.name}@${p.newVersion}`;
            try {
              execSync(`git tag ${tag}`);
              execSync(`git push origin ${tag}`);
              console.log(`Pushed git tag: ${tag}`);
            } catch (err) {
              console.warn(`Tag ${tag} creation note: ${err.message}`);
            }
          }
          '
