name: PR Test Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  group: pr-test-deploy-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  publish-test-version:
    name: Publish Test Versions to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Base Branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Detect Version Changes
        id: version_check
        run: node .github/scripts/detect-version-changes.mjs "origin/${{ github.base_ref }}"

      - name: Report Skip
        if: steps.version_check.outputs.has_changes != 'true'
        run: echo "No package versions changed in this PR. Skipping test npm deployment."

      - name: Setup Project
        if: steps.version_check.outputs.has_changes == 'true'
        uses: ./.github/actions/setup-project
        with:
          npm_token: ${{ secrets.NPM_TOKEN }}

      - name: Apply PR Test Versions
        id: apply_versions
        if: steps.version_check.outputs.has_changes == 'true'
        env:
          PR_NUMBER: ${{ github.event.number }}
          RUN_NUMBER: ${{ github.run_number }}
          PACKAGES_JSON: ${{ steps.version_check.outputs.packages_json }}
        run: node .github/scripts/apply-pr-version.mjs

      - name: Build & Test Packages
        if: steps.version_check.outputs.has_changes == 'true'
        env:
          PACKAGES_JSON: ${{ steps.version_check.outputs.packages_json }}
        run: |
          node -e '
          const { execSync } = require("node:child_process");
          const pkgs = JSON.parse(process.env.PACKAGES_JSON);
          const filters = pkgs.map(p => `--filter="${p.name}..."`).join(" ");
          console.log(`\n========================================`);
          console.log(`Building & Testing test packages: ${pkgs.map(p => p.name).join(", ")}`);
          console.log(`========================================\n`);
          execSync(`pnpm exec turbo build ${filters}`, { stdio: "inherit" });
          execSync(`pnpm exec turbo test ${filters}`, { stdio: "inherit" });
          '

      - name: Publish Test Packages to npm
        if: steps.version_check.outputs.has_changes == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          UPDATED_PACKAGES_JSON: ${{ steps.apply_versions.outputs.updated_packages_json }}
        run: |
          node -e '
          const { execSync } = require("node:child_process");
          const pkgs = JSON.parse(process.env.UPDATED_PACKAGES_JSON);
          for (const p of pkgs) {
            console.log(`\n========================================`);
            console.log(`Publishing test release: ${p.name}@${p.testVersion}`);
            console.log(`========================================\n`);
            execSync(`pnpm --filter "${p.name}" publish --tag test --access public --no-git-checks`, {
              stdio: "inherit",
              env: { ...process.env, NODE_AUTH_TOKEN: process.env.NPM_TOKEN }
            });
          }
          '

      - name: Comment on PR
        if: steps.version_check.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = process.env.COMMENT_MARKDOWN;
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const botComment = comments.data.find(c =>
              c.body && c.body.includes("Bobslab Prerelease Test Build")
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody,
              });
            }
        env:
          COMMENT_MARKDOWN: ${{ steps.apply_versions.outputs.comment_markdown }}
